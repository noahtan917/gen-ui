<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenUI Demo</title>
    <script>

    <script type="module" src="/src/main.tsx"></script>
