<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:24px;font-family:var(--font-text);color:var(--text-primary)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;background:#F4F6F9;padding:16px;border-radius:6px;font-size:12px"><div style="height:84px;border-radius:6px;padding:12px;background:#fff;box-shadow:inset 0 0 0 1px #E3E7EE"><b>Card</b></div><div style="height:84px;border-radius:6px;padding:12px;background:#EEF1F5"><b>Sunken</b></div><div style="height:84px;border-radius:6px;padding:12px;background:#fff;box-shadow:var(--shadow-overlay)"><b>Overlay</b></div><div style="height:84px;border-radius:6px;padding:12px;background:#12161F;color:#F1F3F7;box-shadow:inset 0 0 0 1px #252C39"><b>Dark card</b></div></div></body></html>
